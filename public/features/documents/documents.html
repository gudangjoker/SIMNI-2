<!-- SIMNI PWA modular fragment: documents -->

<template data-simni-view>
<div id="view-dokumen" class="view-section hidden max-w-7xl mx-auto space-y-6 fade-in pb-16" hidden>
    <!-- Header Card -->
    <div class="bg-white dark:bg-[#111113] p-5 sm:p-6 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-2xs space-y-5">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-500/10 dark:bg-blue-500/20 text-blue-600 dark:text-blue-400 flex items-center justify-center text-lg shrink-0">
                    <i class="fas fa-folder-open" aria-hidden="true"></i>
                </div>
                <div>
                    <h2 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white tracking-tight">Gudang File &amp; LKPD</h2>
                    <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-0.5">Unggah, simpan, dan kelola dokumen administrasi serta lembar kerja siswa.</p>
                </div>
            </div>

            <button data-simni-action="openModal" data-simni-trigger="click" data-simni-args='["modal-form-dokumen"]' class="h-10 px-5 bg-primary hover:bg-indigo-600 text-white rounded-xl text-xs sm:text-sm font-bold shadow-2xs hover:shadow-sm flex items-center justify-center gap-2 transition-all cursor-pointer active:scale-95 w-full md:w-auto shrink-0">
                <i class="fas fa-cloud-upload-alt text-xs"></i>
                <span>Unggah Dokumen</span>
            </button>
        </div>

        <!-- Segmented Tabs -->
        <div class="flex items-center p-1 bg-slate-100 dark:bg-[#18181b] rounded-xl border border-slate-200/80 dark:border-slate-800 w-full sm:w-auto">
            <button data-simni-action="setDokumenTab" data-simni-trigger="click" data-simni-args='["Administrasi"]' id="tab-admin" class="flex-1 sm:flex-none px-4 py-2 border-b-2 border-primary text-primary font-bold text-xs sm:text-sm transition-all cursor-pointer">
                <i class="fas fa-archive mr-1.5"></i>File Administrasi
            </button>
            <button data-simni-action="setDokumenTab" data-simni-trigger="click" data-simni-args='["LKPD"]' id="tab-lkpd" class="flex-1 sm:flex-none px-4 py-2 border-b-2 border-transparent text-slate-500 dark:text-slate-400 font-bold text-xs sm:text-sm hover:text-slate-800 dark:hover:text-slate-200 transition-all cursor-pointer">
                <i class="fas fa-file-alt mr-1.5"></i>LKPD Siswa
            </button>
        </div>
    </div>

    <!-- Document Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="dokumen-grid"></div>
</div>
</template>

<template data-simni-modal>
<div id="modal-form-dokumen" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-[10000] hidden flex-col justify-center items-center p-3 sm:p-4 opacity-0 transition-opacity duration-200">
    <div class="bg-white dark:bg-[#111113] rounded-3xl w-full max-w-md overflow-hidden border border-slate-200/80 dark:border-slate-800 shadow-2xl flex flex-col max-h-[92vh]">
        <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-800/80 flex justify-between items-center bg-slate-50/50 dark:bg-[#141416]/50">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-lg bg-blue-500/10 text-blue-600 flex items-center justify-center text-sm">
                    <i class="fas fa-file-upload"></i>
                </div>
                <h3 class="font-bold text-base text-slate-900 dark:text-white">Unggah Dokumen</h3>
            </div>
            <button data-simni-action="closeModal" data-simni-trigger="click" data-simni-args='["modal-form-dokumen"]' class="w-8 h-8 rounded-full bg-slate-100 dark:bg-[#1c1c1f] hover:bg-slate-200 dark:hover:bg-slate-700 flex items-center justify-center text-slate-500 dark:text-slate-400 cursor-pointer text-xs"><i class="fas fa-times"></i></button>
        </div>
        <form data-simni-action="submitDokumenMurni" data-simni-trigger="submit" data-simni-argument="event" class="p-5 sm:p-6 space-y-4 overflow-y-auto hide-scrollbar">
            <div class="bg-blue-50/80 dark:bg-blue-950/30 p-3.5 text-xs text-center text-blue-700 dark:text-blue-300 font-medium rounded-xl border border-blue-200/70 dark:border-blue-800/50 leading-relaxed">
                <i class="fas fa-cloud-upload-alt mr-1"></i> Mendukung format PDF, Word, Excel, dan Gambar (Maksimal 5MB).
            </div>
            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Kategori Dokumen</label>
                <select id="input-doc-kat" class="w-full h-11 px-3.5 bg-slate-50/70 dark:bg-[#161618] border border-slate-200/80 dark:border-slate-700/80 rounded-xl text-xs sm:text-sm font-bold text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                    <option value="Administrasi">Administrasi Guru</option>
                    <option value="LKPD">Lembar Kerja (LKPD)</option>
                </select>
            </div>
            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Mata Pelajaran</label>
                <select id="input-doc-mapel" class="w-full h-11 px-3.5 bg-slate-50/70 dark:bg-[#161618] border border-slate-200/80 dark:border-slate-700/80 rounded-xl text-xs sm:text-sm font-bold text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                    <option value="Umum">Umum / Semua Mapel</option>
                    <option value="Matematika">Matematika</option>
                    <option value="Bahasa Indonesia">Bahasa Indonesia</option>
                    <option value="Pendidikan Pancasila">Pendidikan Pancasila</option>
                    <option value="IPAS">IPAS</option>
                    <option value="Seni Rupa">Seni Rupa</option>
                    <option value="PJOK">PJOK</option>
                    <option value="PAI">PAI</option>
                    <option value="Bahasa Inggris">Bahasa Inggris</option>
                    <option value="Bahasa Sunda">Bahasa Sunda</option>
                    <option value="Komputer">Komputer</option>
                    <option value="BTQ">BTQ</option>
                    <option value="Murojaah">Murojaah</option>
                </select>
            </div>
            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Judul Dokumen</label>
                <input type="text" id="input-doc-nama" required placeholder="Contoh: Rencana Pembelajaran Modul 1" class="w-full h-11 px-3.5 bg-slate-50/70 dark:bg-[#161618] border border-slate-200/80 dark:border-slate-700/80 rounded-xl text-xs sm:text-sm font-semibold text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
            </div>
            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Pilih Berkas</label>
                <input type="file" id="input-doc-file" accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg,image/png,image/jpeg,application/pdf" required class="w-full p-2 text-xs cursor-pointer bg-slate-50/70 dark:bg-[#161618] rounded-xl border border-slate-200/80 dark:border-slate-700/80 text-slate-600 dark:text-slate-300 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-primary/10 file:text-primary hover:file:bg-primary/20">
            </div>
            <div class="pt-4 border-t border-slate-100 dark:border-slate-800/80 flex items-center justify-end gap-2.5">
                <button type="button" data-simni-action="closeModal" data-simni-trigger="click" data-simni-args='["modal-form-dokumen"]' class="h-10 px-4 bg-slate-100 dark:bg-[#1f2438] hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-xl text-xs font-bold transition-all cursor-pointer">Batal</button>
                <button type="submit" id="btn-upload-murni" class="h-10 px-5 bg-primary hover:bg-indigo-600 text-white rounded-xl text-xs font-bold shadow-2xs hover:shadow-sm transition-all cursor-pointer flex items-center gap-1.5 active:scale-95">
                    <i class="fas fa-upload text-xs"></i><span>Mulai Unggah</span>
                </button>
            </div>
        </form>
    </div>
</div>
</template>
