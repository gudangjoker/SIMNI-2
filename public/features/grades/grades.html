<!-- SIMNI PWA modular fragment: grades -->

<template data-simni-view>
<div id="view-nilai" class="view-section hidden max-w-7xl mx-auto space-y-6 fade-in pb-16" hidden>
    <!-- Header Card -->
    <div class="bg-white dark:bg-[#111113] p-5 sm:p-6 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-2xs space-y-5">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-primary/10 dark:bg-primary/20 text-primary flex items-center justify-center text-lg shrink-0">
                    <i class="fas fa-star" aria-hidden="true"></i>
                </div>
                <div>
                    <h2 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white tracking-tight">Sistem Nilai Akademik</h2>
                    <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-0.5">Penilaian berbasis Tujuan Pembelajaran (TP), rekapitulasi capaian, dan buku induk.</p>
                </div>
            </div>

            <!-- Segmented Navigation Tabs -->
            <div class="simni-tab-group">
                <button data-simni-action="setNilaiTab" data-simni-trigger="click" data-simni-args='["input"]' id="tab-nilai-input" class="simni-tab active">
                    <i class="fas fa-edit mr-1.5"></i>Input Nilai
                </button>
                <button data-simni-action="setNilaiTab" data-simni-trigger="click" data-simni-args='["rekap"]' id="tab-nilai-rekap" class="simni-tab">
                    <i class="fas fa-table mr-1.5"></i>Rekap TP
                </button>
                <button data-simni-action="setNilaiTab" data-simni-trigger="click" data-simni-args='["induk"]' id="tab-nilai-induk" class="simni-tab">
                    <i class="fas fa-address-book mr-1.5"></i>Buku Induk
                </button>
            </div>
        </div>
    </div>

    <!-- TAB 1: INPUT NILAI TP -->
    <div id="nilai-tab-input" class="space-y-4">
        <!-- Filter Card with Master TP Action -->
        <div class="bg-white dark:bg-[#111113] p-5 rounded-2xl shadow-2xs border border-slate-200/80 dark:border-slate-800 space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-slate-100 dark:border-slate-800/80">
                <div class="flex items-center gap-2">
                    <span class="w-1.5 h-3.5 rounded-full bg-primary"></span>
                    <span class="text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider">Filter Penilaian Siswa</span>
                </div>
                <button data-simni-action="openModal" data-simni-trigger="click" data-simni-args='["modal-kelola-tp"]' class="h-9 px-3.5 bg-slate-100 dark:bg-[#1f2438] hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200/80 dark:border-slate-700 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-bold shadow-2xs flex items-center justify-center gap-2 transition-all cursor-pointer active:scale-95 shrink-0 self-start sm:self-auto">
                    <i class="fas fa-cog text-primary text-xs"></i>
                    <span>Kelola Master TP</span>
                </button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1.5" for="filter-mapel-nilai">Mata Pelajaran</label>
                <select id="filter-mapel-nilai" aria-label="Mata pelajaran nilai" data-simni-action="updateTPDropdown" data-simni-trigger="change" class="w-full h-11 px-3.5 bg-slate-50/70 dark:bg-[#161618] border border-slate-200/80 dark:border-slate-700/80 rounded-xl text-xs sm:text-sm font-bold text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
                    <option value="">Pilih Mapel...</option>
                    <option value="Matematika">Matematika</option>
                    <option value="Bahasa Indonesia">Bahasa Indonesia</option>
                    <option value="Pendidikan Pancasila">Pendidikan Pancasila</option>
                    <option value="IPAS">IPAS</option>
                    <option value="Seni Rupa">Seni Rupa</option>
                    <option value="PJOK">PJOK</option>
                    <option value="PAI">PAI</option>
                    <option value="Bahasa Inggris">Bahasa Inggris</option>
                    <option value="Bahasa Sunda">Bahasa Sunda</option>
                    <option value="Komputer">Komputer</option>
                    <option value="BTQ">BTQ</option>
                    <option value="Murojaah">Murojaah</option>
                </select>
            </div>
            <div>
                <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1.5" for="filter-tp-nilai">Tujuan Pembelajaran (TP)</label>
                <select id="filter-tp-nilai" aria-label="Tujuan pembelajaran nilai" data-simni-action="renderNilaiGrid" data-simni-trigger="change" class="w-full h-11 px-3.5 bg-slate-50/70 dark:bg-[#161618] border border-slate-200/80 dark:border-slate-700/80 rounded-xl text-xs sm:text-sm font-bold text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
                    <option value="">Pilih Mapel Dahulu...</option>
                </select>
            </div>
        </div>

        <!-- Grade Input Grid Card -->
        <div class="bg-white dark:bg-[#111113] rounded-2xl shadow-2xs border border-slate-200/80 dark:border-slate-800 overflow-hidden relative">
            <div id="nilai-empty-state" class="p-12 text-center text-slate-400 dark:text-slate-500 space-y-2">
                <div class="w-12 h-12 rounded-2xl bg-indigo-50 dark:bg-indigo-950/40 text-primary flex items-center justify-center text-xl mx-auto mb-2">
                    <i class="fas fa-hand-pointer"></i>
                </div>
                <p class="font-bold text-slate-700 dark:text-slate-300 text-sm">Pilih Mata Pelajaran dan TP</p>
                <p class="text-xs text-slate-400 max-w-xs mx-auto">Tentukan mata pelajaran dan tujuan pembelajaran di atas untuk memanggil lembar penilaian siswa.</p>
            </div>

            <div id="nilai-grid-container" class="hidden">
                <div id="nilai-draft-status-container" class="px-5 pt-3 empty:hidden">
                    <div id="nilai-table-body-draft-status" data-simni-draft-status class="hidden"></div>
                </div>

                <div class="overflow-x-auto max-h-[520px] hide-scrollbar">
                    <table class="w-full text-left border-collapse relative min-w-[500px]">
                        <thead class="sticky top-0 z-10 bg-slate-50/95 dark:bg-[#161618]/95 backdrop-blur-sm shadow-2xs text-slate-500 dark:text-slate-400 text-[11px] font-bold uppercase tracking-wider">
                            <tr>
                                <th class="py-3 px-4 font-bold border-b border-slate-200/80 dark:border-slate-800 w-16 text-center">No</th>
                                <th class="py-3 px-5 font-bold border-b border-slate-200/80 dark:border-slate-800 min-w-[240px]">Nama Siswa</th>
                                <th class="py-3 px-4 font-bold border-b border-slate-200/80 dark:border-slate-800 w-36 text-center">Nilai (0-100)</th>
                            </tr>
                        </thead>
                        <tbody id="nilai-table-body" class="text-xs sm:text-sm divide-y divide-slate-100 dark:divide-slate-800/80 text-slate-800 dark:text-slate-200"></tbody>
                    </table>
                </div>

                <div class="p-4 sm:px-5 border-t border-slate-100 dark:border-slate-800/80 bg-slate-50/50 dark:bg-[#141416]/50 flex flex-col sm:flex-row justify-between items-center gap-3">
                    <p class="text-[11px] text-slate-400 font-medium">*Nilai tersimpan lokal secara instan dan siap disinkronkan ke server.</p>
                    <button data-simni-action="saveNilaiBatch" data-simni-trigger="click" class="h-10 px-5 bg-primary hover:bg-indigo-600 text-white rounded-xl text-xs sm:text-sm font-bold shadow-2xs hover:shadow-sm flex items-center justify-center gap-2 transition-all cursor-pointer active:scale-95 w-full sm:w-auto">
                        <i class="fas fa-save text-xs"></i>
                        <span>Simpan Massal</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- TAB 2: REKAPITULASI TP -->
    <div id="nilai-tab-rekap" class="hidden space-y-4">
        <div class="bg-white dark:bg-[#111113] p-5 rounded-2xl shadow-2xs border border-slate-200/80 dark:border-slate-800 grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
            <div>
                <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1.5" for="rekap-mapel-nilai">Mata Pelajaran</label>
                <select id="rekap-mapel-nilai" data-simni-action="updateRekapTPDropdown" data-simni-trigger="change" class="w-full h-11 px-3.5 bg-slate-50/70 dark:bg-[#161618] border border-slate-200/80 dark:border-slate-700/80 rounded-xl text-xs sm:text-sm font-bold text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
                    <option value="">Pilih Mata Pelajaran</option>
                    <option value="Matematika">Matematika</option>
                    <option value="Bahasa Indonesia">Bahasa Indonesia</option>
                    <option value="Pendidikan Pancasila">Pendidikan Pancasila</option>
                    <option value="IPAS">IPAS</option>
                    <option value="Seni Rupa">Seni Rupa</option>
                    <option value="PJOK">PJOK</option>
                    <option value="PAI">PAI</option>
                    <option value="Bahasa Inggris">Bahasa Inggris</option>
                    <option value="Bahasa Sunda">Bahasa Sunda</option>
                    <option value="Komputer">Komputer</option>
                    <option value="BTQ">BTQ</option>
                    <option value="Murojaah">Murojaah</option>
                </select>
            </div>
            <div>
                <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1.5" for="rekap-tp-nilai">Tujuan Pembelajaran</label>
                <select id="rekap-tp-nilai" data-simni-action="invalidateRekapNilai" data-simni-trigger="change" class="w-full h-11 px-3.5 bg-slate-50/70 dark:bg-[#161618] border border-slate-200/80 dark:border-slate-700/80 rounded-xl text-xs sm:text-sm font-bold text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
                    <option value="">Pilih Mapel Dahulu</option>
                </select>
            </div>
            <div>
                <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1.5" for="rekap-siswa-nilai">Filter Siswa</label>
                <select id="rekap-siswa-nilai" data-simni-action="invalidateRekapNilai" data-simni-trigger="change" class="w-full h-11 px-3.5 bg-slate-50/70 dark:bg-[#161618] border border-slate-200/80 dark:border-slate-700/80 rounded-xl text-xs sm:text-sm font-bold text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
                    <option value="">Semua Siswa</option>
                </select>
            </div>

            <!-- Action Buttons Row -->
            <div class="col-span-full flex flex-wrap items-center gap-2.5 pt-2 border-t border-slate-100 dark:border-slate-800/80">
                <button type="button" data-simni-action="showRekapNilai" data-simni-trigger="click" class="h-10 px-5 bg-primary hover:bg-indigo-600 text-white rounded-xl text-xs sm:text-sm font-bold shadow-2xs hover:shadow-sm transition-all cursor-pointer active:scale-95">
                    Tampilkan Rekap
                </button>
                <button type="button" data-simni-action="previewPrintRekapNilai" data-simni-trigger="click" class="h-10 px-4 bg-slate-100 dark:bg-[#18181b] hover:bg-slate-200 dark:hover:bg-[#202024] border border-slate-200/80 dark:border-slate-700/80 text-slate-700 dark:text-slate-300 rounded-xl text-xs sm:text-sm font-bold transition-all flex items-center justify-center gap-2 cursor-pointer shadow-2xs active:scale-95">
                    <i class="fas fa-print text-xs text-slate-400"></i>
                    <span>Pratinjau Cetak</span>
                </button>
                <button type="button" data-simni-action="unduhRekapNilai" data-simni-trigger="click" class="h-10 px-4 bg-emerald-600/10 hover:bg-emerald-600/20 text-emerald-700 dark:text-emerald-400 border border-emerald-500/30 rounded-xl text-xs sm:text-sm font-bold transition-all flex items-center justify-center gap-2 cursor-pointer shadow-2xs active:scale-95">
                    <i class="fas fa-file-excel text-xs"></i>
                    <span>Unduh Excel</span>
                </button>
            </div>
        </div>

        <p id="rekap-nilai-hint" class="p-4 text-xs font-medium text-slate-400 dark:text-slate-500 text-center" role="status">Pilih mata pelajaran, TP, dan siswa, lalu tekan Tampilkan Rekap.</p>

        <!-- Rekap Content Section -->
        <section id="rekap-nilai-result" class="simni-tp-recap bg-white dark:bg-[#111113] rounded-2xl shadow-2xs border border-slate-200/80 dark:border-slate-800 overflow-hidden" hidden>
            <header class="simni-tp-summary p-5 border-b border-slate-100 dark:border-slate-800/80 flex flex-col md:flex-row justify-between items-start md:items-center gap-3 bg-slate-50/50 dark:bg-[#141416]/50">
                <div>
                    <h3 id="rekap-tp-title" class="font-bold text-base text-slate-900 dark:text-white leading-tight"></h3>
                    <p id="rekap-tp-description" class="text-xs text-slate-500 dark:text-slate-400 mt-0.5 leading-relaxed max-w-2xl"></p>
                </div>
                <div class="flex gap-2">
                    <button type="button" data-simni-action="previewPrintRekapNilai" data-simni-trigger="click" class="h-9 px-3.5 bg-white dark:bg-[#18181b] border border-slate-200/80 dark:border-slate-700/80 text-slate-700 dark:text-slate-200 hover:bg-slate-50 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-2xs cursor-pointer">
                        <i class="fas fa-print text-xs"></i><span>Cetak</span>
                    </button>
                    <button type="button" data-simni-action="unduhRekapNilai" data-simni-trigger="click" class="h-9 px-3.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-2xs cursor-pointer">
                        <i class="fas fa-file-excel text-xs"></i><span>Excel</span>
                    </button>
                </div>
            </header>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50/80 dark:bg-[#161618] border-b border-slate-200/80 dark:border-slate-800 text-slate-500 dark:text-slate-400 text-[11px] font-bold uppercase tracking-wider">
                        <tr>
                            <th scope="col" class="py-3 px-5">Nama Siswa</th>
                            <th scope="col" class="py-3 px-4 text-center w-28">Nilai</th>
                            <th scope="col" class="py-3 px-4 text-right w-24">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="rekap-nilai-body" class="text-xs sm:text-sm divide-y divide-slate-100 dark:divide-slate-800/80 text-slate-800 dark:text-slate-200"></tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- TAB 3: BUKU INDUK SISWA -->
    <div id="nilai-tab-induk" class="hidden space-y-4">
        <div class="bg-white dark:bg-[#111113] p-5 rounded-2xl shadow-2xs border border-slate-200/80 dark:border-slate-800 flex flex-col md:flex-row gap-4 items-end">
            <div class="flex-1 w-full">
                <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1.5" for="induk-siswa-select">Cari / Pilih Siswa</label>
                <select id="induk-siswa-select" data-simni-action="renderBukuInduk" data-simni-trigger="change" class="w-full h-11 px-4 bg-slate-50/70 dark:bg-[#161618] border border-slate-200/80 dark:border-slate-700/80 rounded-xl text-sm font-bold text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
                    <option value="">-- Sentuh untuk Pilih Siswa --</option>
                </select>
            </div>
            <button data-simni-action="cetakBukuInduk" data-simni-trigger="click" class="w-full md:w-auto h-11 px-5 bg-primary hover:bg-indigo-600 text-white rounded-xl text-xs sm:text-sm font-bold shadow-2xs hover:shadow-sm flex items-center justify-center gap-2 transition-all cursor-pointer active:scale-95 shrink-0">
                <i class="fas fa-file-pdf text-xs"></i>
                <span>Unduh PDF Induk</span>
            </button>
        </div>

        <div id="induk-content-area" class="bg-slate-50/50 dark:bg-[#0c0c0e] rounded-2xl border border-slate-200/80 dark:border-slate-800 overflow-hidden relative min-h-[420px]">
            <div class="p-8 text-center text-slate-400 dark:text-slate-500 absolute inset-0 flex flex-col items-center justify-center">
                <div class="w-16 h-16 rounded-2xl bg-slate-100 dark:bg-[#161618] flex items-center justify-center text-2xl text-slate-400 mb-3">
                    <i class="fas fa-user-graduate"></i>
                </div>
                <p class="font-bold text-slate-700 dark:text-slate-300 text-base">Profil Buku Induk</p>
                <p class="text-xs text-slate-400 max-w-xs mt-1">Pilih nama murid di atas untuk memanggil seluruh riwayat capaian akademik Buku Induk.</p>
            </div>
        </div>
    </div>
</div>
</template>

<template data-simni-modal>
    <!-- MODAL KELOLA MASTER TP -->
    <div id="modal-kelola-tp" style="z-index: 10000;" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm hidden flex-col items-center justify-center p-3 sm:p-4 no-print opacity-0 transition-opacity duration-200">
        <div class="bg-white dark:bg-[#111113] rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden flex flex-col max-h-[92vh] border border-slate-200/80 dark:border-slate-800">
            <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-800/80 flex justify-between items-center bg-slate-50/50 dark:bg-[#141416]/50">
                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-lg bg-primary/10 text-primary flex items-center justify-center text-sm">
                        <i class="fas fa-list-check"></i>
                    </div>
                    <h3 class="font-bold text-base text-slate-900 dark:text-white">Kelola Tujuan Pembelajaran</h3>
                </div>
                <button aria-label="Tutup dialog" data-simni-action="closeModal" data-simni-trigger="click" data-simni-args='["modal-kelola-tp"]' class="w-8 h-8 rounded-full bg-slate-100 dark:bg-[#1c1c1f] hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-500 dark:text-slate-400 flex items-center justify-center transition-colors cursor-pointer text-xs"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-5 sm:p-6 overflow-y-auto flex-1 bg-slate-50/40 dark:bg-[#0c0c0e]/40 space-y-4 hide-scrollbar">
                <!-- Template & Impor Controls -->
                <div class="flex flex-col sm:flex-row gap-2">
                    <div class="flex flex-1 gap-1.5 bg-indigo-50/70 dark:bg-indigo-950/30 border border-indigo-200/70 dark:border-indigo-800/50 p-1 rounded-xl">
                        <label class="sr-only" for="tp-import-template">Jenis template impor TP</label>
                        <select id="tp-import-template" data-simni-action="updateTPTemplateLink" data-simni-trigger="change" class="min-w-0 flex-1 px-2.5 bg-transparent text-indigo-700 dark:text-indigo-300 text-xs font-bold focus:outline-none cursor-pointer">
                            <option value="one">Template 1 Kelas</option>
                            <option value="multi">Template 12 Kelas</option>
                        </select>
                        <a id="tp-import-template-download" href="templates/Template_Impor_TP_1_Kelas.xlsx" download class="h-8 px-3 bg-primary hover:bg-indigo-600 text-white rounded-lg text-xs font-bold shadow-2xs flex items-center justify-center gap-1 transition-colors" aria-label="Unduh template impor TP">
                            <i class="fas fa-download text-[10px]"></i><span>Unduh</span>
                        </a>
                    </div>
                    <div class="flex gap-2">
                        <label class="h-10 px-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-2xs flex items-center justify-center gap-1.5 cursor-pointer transition-colors active:scale-95">
                            <i class="fas fa-file-excel text-xs"></i><span>Impor</span>
                            <input type="file" class="hidden" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,.xls,application/vnd.ms-excel" data-simni-action="importTPExcel" data-simni-trigger="change" data-simni-argument="event">
                        </label>
                        <button type="button" data-simni-action="openSIMNILens" data-simni-trigger="click" class="h-10 px-3.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-2xs flex items-center justify-center gap-1.5 transition-colors cursor-pointer active:scale-95">
                            <i class="fas fa-camera text-xs"></i><span>Lens</span>
                        </button>
                    </div>
                </div>

                <!-- Export & Print Action Chips -->
                <div class="flex gap-2">
                    <button type="button" data-simni-action="exportTPExcel" data-simni-trigger="click" class="flex-1 h-9 bg-amber-500/10 hover:bg-amber-500/20 text-amber-700 dark:text-amber-400 border border-amber-500/30 rounded-xl text-xs font-bold shadow-2xs flex items-center justify-center gap-1.5 transition-colors cursor-pointer">
                        <i class="fas fa-file-export text-xs"></i><span>Ekspor Excel</span>
                    </button>
                    <button type="button" data-simni-action="previewPrintTP" data-simni-trigger="click" class="flex-1 h-9 bg-white dark:bg-[#18181b] border border-slate-200/80 dark:border-slate-700/80 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-bold shadow-2xs flex items-center justify-center gap-1.5 hover:bg-slate-50 dark:hover:bg-[#202024] transition-colors cursor-pointer">
                        <i class="fas fa-print text-xs text-slate-400"></i><span>Pratinjau Cetak</span>
                    </button>
                </div>

                <!-- Form Add TP -->
                <form id="form-add-tp" data-simni-action="submitTP" data-simni-trigger="submit" data-simni-argument="event" class="bg-white dark:bg-[#111113] p-5 rounded-2xl border border-slate-200/80 dark:border-slate-800 space-y-3.5 shadow-2xs">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1" for="input-tp-mapel">Mata Pelajaran</label>
                            <select id="input-tp-mapel" required class="w-full h-10 px-3 bg-slate-50/70 dark:bg-[#161618] border border-slate-200/80 dark:border-slate-700/80 rounded-xl text-xs font-bold dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
