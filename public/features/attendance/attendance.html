<!-- SIMNI PWA modular fragment: attendance -->

<template data-simni-view>
<div id="view-presensi" class="view-section hidden max-w-7xl mx-auto space-y-6 fade-in pb-16" hidden>
    <!-- Header Card -->
    <div class="bg-white dark:bg-[#111113] p-5 sm:p-6 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-2xs space-y-5">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-500/10 dark:bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 flex items-center justify-center text-lg shrink-0">
                    <i class="fas fa-calendar-check" aria-hidden="true"></i>
                </div>
                <div>
                    <h2 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white tracking-tight">Presensi Kehadiran</h2>
                    <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-0.5">Pemindaian QR instan, pencatatan status manual, dan rekapitulasi berkala.</p>
                </div>
            </div>

            <!-- Segmented Tab Navigation -->
            <div class="simni-tab-group w-full sm:w-auto">
                <button data-simni-action="setPresensiTab" data-simni-trigger="click" data-simni-args='["input"]' id="tab-presensi-input" class="simni-tab active flex-1 sm:flex-none">
                    <i class="fas fa-pen-alt mr-1"></i><span>Pencatatan</span>
                </button>
                <button data-simni-action="setPresensiTab" data-simni-trigger="click" data-simni-args='["rekap"]' id="tab-presensi-rekap" class="simni-tab flex-1 sm:flex-none">
                    <i class="fas fa-chart-pie mr-1"></i><span>Rekapitulasi</span>
                </button>
            </div>
        </div>
    </div>

    <!-- TAB 1: PENCATATAN MANUAL & SCANNER -->
    <div id="presensi-tab-input" class="space-y-4">
        <!-- Control Bar -->
        <div class="flex flex-row justify-between items-center gap-3 bg-white dark:bg-[#111113] p-4 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-2xs">
            <div class="flex items-center gap-2">
                <label class="sr-only" for="presensi-date">Pilih Tanggal Presensi</label>
                <div class="relative flex items-center">
                    <input type="date" id="presensi-date" aria-label="Tanggal presensi" data-simni-action="renderPresensiManual" data-simni-trigger="change" class="h-10 px-3.5 bg-slate-50/70 dark:bg-[#161618] border border-slate-200/80 dark:border-slate-700/80 rounded-xl text-xs sm:text-sm font-bold text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
                </div>
            </div>

            <button data-simni-action="openQRScanner" data-simni-trigger="click" class="simni-qr-scanner-btn active:scale-95 shrink-0" title="Buka Pemindai QR Presensi">
                <i class="fas fa-qrcode text-base" aria-hidden="true"></i>
                <span>Buka Scanner QR</span>
            </button>
        </div>

        <!-- Attendance Entry Table Card -->
        <div class="bg-white dark:bg-[#111113] rounded-2xl shadow-2xs border border-slate-200/80 dark:border-slate-800 overflow-hidden">
            <div id="presensi-draft-status-container" class="px-5 pt-3 empty:hidden">
                <div id="presensi-table-body-draft-status" data-simni-draft-status class="hidden"></div>
            </div>

            <div id="presensi-entry-table" class="overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-[620px]">
                    <thead>
                        <tr class="bg-slate-50/80 dark:bg-[#161618] border-b border-slate-200/80 dark:border-slate-800 text-slate-500 dark:text-slate-400 text-[11px] font-bold uppercase tracking-wider">
                            <th class="py-3.5 px-5 font-bold">Nama Siswa</th>
                            <th class="py-3.5 px-3 font-bold text-center text-emerald-600 dark:text-emerald-400"><span class="px-2 py-0.5 rounded-md bg-emerald-500/10">Hadir</span></th>
                            <th class="py-3.5 px-3 font-bold text-center text-amber-600 dark:text-amber-400"><span class="px-2 py-0.5 rounded-md bg-amber-500/10">Sakit</span></th>
                            <th class="py-3.5 px-3 font-bold text-center text-sky-600 dark:text-sky-400"><span class="px-2 py-0.5 rounded-md bg-sky-500/10">Izin</span></th>
                            <th class="py-3.5 px-3 font-bold text-center text-rose-600 dark:text-rose-400"><span class="px-2 py-0.5 rounded-md bg-rose-500/10">Alpa</span></th>
                            <th class="py-3.5 px-5 font-bold">Keterangan</th>
                        </tr>
                    </thead>
                    <tbody id="presensi-table-body" class="text-xs sm:text-sm divide-y divide-slate-100 dark:divide-slate-800/80 text-slate-800 dark:text-slate-200"></tbody>
                </table>
            </div>

            <!-- Completed State Notice -->
            <div id="presensi-completed-state" class="hidden p-10 text-center text-emerald-700 dark:text-emerald-400">
                <div class="w-14 h-14 rounded-2xl bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 flex items-center justify-center text-2xl mx-auto mb-3">
                    <i class="fas fa-check-circle" aria-hidden="true"></i>
                </div>
                <p class="font-bold text-base sm:text-lg">Presensi Selesai Dicatat</p>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 max-w-sm mx-auto">Seluruh kehadiran siswa pada tanggal ini telah tersimpan lengkap di database.</p>
            </div>

            <!-- Footer Action -->
            <div class="p-4 sm:px-5 border-t border-slate-100 dark:border-slate-800/80 bg-slate-50/50 dark:bg-[#141416]/50 flex justify-end">
                <button id="presensi-primary-action" data-simni-action="savePresensiManual" data-simni-trigger="click" class="h-10 px-5 bg-primary hover:bg-indigo-600 text-white rounded-xl text-xs sm:text-sm font-bold shadow-2xs hover:shadow-sm flex items-center gap-2 transition-all cursor-pointer active:scale-95">
                    <i class="fas fa-save text-xs"></i>
                    <span>Simpan Kehadiran</span>
                </button>
            </div>
        </div>
    </div>

    <!-- TAB 2: REKAPITULASI KEHADIRAN -->
    <div id="presensi-tab-rekap" class="hidden space-y-4">
        <!-- Filter Bar -->
        <div class="bg-white dark:bg-[#111113] p-5 rounded-2xl shadow-2xs border border-slate-200/80 dark:border-slate-800 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 items-end">
            <div>
                <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1.5" for="filter-presensi-waktu">Rentang Waktu</label>
                <select id="filter-presensi-waktu" data-simni-action="renderRekapPresensi" data-simni-trigger="change" class="w-full h-11 px-3.5 bg-slate-50/70 dark:bg-[#161618] border border-slate-200/80 dark:border-slate-700/80 rounded-xl text-xs sm:text-sm font-bold text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
                    <option value="hari">Hari / Tanggal Tertentu</option>
                    <option value="bulan">Bulan Ini</option>
                    <option value="semester">Semester Ini</option>
                </select>
            </div>

            <div id="container-filter-tanggal">
                <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1.5" for="filter-presensi-tanggal">Pilih Tanggal</label>
                <input type="date" id="filter-presensi-tanggal" data-simni-action="renderRekapPresensi" data-simni-trigger="change" class="w-full h-11 px-3.5 bg-slate-50/70 dark:bg-[#161618] border border-slate-200/80 dark:border-slate-700/80 rounded-xl text-xs sm:text-sm font-bold text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
            </div>

            <div>
                <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1.5" for="filter-presensi-siswa">Filter Siswa</label>
                <select id="filter-presensi-siswa" data-simni-action="renderRekapPresensi" data-simni-trigger="change" class="w-full h-11 px-3.5 bg-slate-50/70 dark:bg-[#161618] border border-slate-200/80 dark:border-slate-700/80 rounded-xl text-xs sm:text-sm font-bold text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
                    <option value="">Semua Siswa</option>
                </select>
            </div>

            <div>
                <button data-simni-action="cetakRekapPresensiPDF" data-simni-trigger="click" class="w-full h-11 px-4 bg-slate-900 hover:bg-black dark:bg-[#1e1e24] dark:hover:bg-[#25252c] text-white rounded-xl text-xs sm:text-sm font-bold shadow-2xs flex items-center justify-center gap-2 border border-slate-700/60 dark:border-slate-700 transition-all cursor-pointer active:scale-95">
                    <i class="fas fa-file-pdf text-rose-400"></i>
                    <span>Unduh Rekap PDF</span>
                </button>
            </div>
        </div>

        <!-- 4 KPI Metrics -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4">
            <div class="bg-white dark:bg-[#111113] p-4 sm:p-5 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-2xs hover:shadow-md transition-all flex items-center justify-between">
                <div>
                    <span class="block text-[10px] sm:text-[11px] font-bold uppercase tracking-wider text-emerald-600 dark:text-emerald-400">Hadir</span>
                    <p id="rekap-hadir" class="text-2xl sm:text-3xl font-black text-slate-800 dark:text-white mt-1 tabular-nums">0</p>
                </div>
                <div class="w-10 h-10 rounded-xl bg-emerald-500/10 text-emerald-600 flex items-center justify-center text-lg">
                    <i class="fas fa-check"></i>
                </div>
            </div>

            <div class="bg-white dark:bg-[#111113] p-4 sm:p-5 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-2xs hover:shadow-md transition-all flex items-center justify-between">
                <div>
                    <span class="block text-[10px] sm:text-[11px] font-bold uppercase tracking-wider text-amber-500">Sakit</span>
                    <p id="rekap-sakit" class="text-2xl sm:text-3xl font-black text-slate-800 dark:text-white mt-1 tabular-nums">0</p>
                </div>
                <div class="w-10 h-10 rounded-xl bg-amber-500/10 text-amber-500 flex items-center justify-center text-lg">
                    <i class="fas fa-thermometer-half"></i>
                </div>
            </div>

            <div class="bg-white dark:bg-[#111113] p-4 sm:p-5 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-2xs hover:shadow-md transition-all flex items-center justify-between">
                <div>
                    <span class="block text-[10px] sm:text-[11px] font-bold uppercase tracking-wider text-sky-500">Izin</span>
                    <p id="rekap-izin" class="text-2xl sm:text-3xl font-black text-slate-800 dark:text-white mt-1 tabular-nums">0</p>
                </div>
                <div class="w-10 h-10 rounded-xl bg-sky-500/10 text-sky-500 flex items-center justify-center text-lg">
                    <i class="fas fa-envelope-open-text"></i>
                </div>
            </div>

            <div class="bg-white dark:bg-[#111113] p-4 sm:p-5 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-2xs hover:shadow-md transition-all flex items-center justify-between">
                <div>
                    <span class="block text-[10px] sm:text-[11px] font-bold uppercase tracking-wider text-rose-500">Alpa</span>
                    <p id="rekap-alpa" class="text-2xl sm:text-3xl font-black text-slate-800 dark:text-white mt-1 tabular-nums">0</p>
                </div>
                <div class="w-10 h-10 rounded-xl bg-rose-500/10 text-rose-500 flex items-center justify-center text-lg">
                    <i class="fas fa-user-times"></i>
                </div>
            </div>
        </div>

        <!-- Rekap Table Card -->
        <div class="bg-white dark:bg-[#111113] rounded-2xl shadow-2xs border border-slate-200/80 dark:border-slate-800 overflow-hidden">
            <div class="overflow-x-auto max-h-[440px] hide-scrollbar">
                <table class="w-full text-left border-collapse relative min-w-[500px]">
                    <thead class="sticky top-0 z-10 bg-slate-50/95 dark:bg-[#161618]/95 backdrop-blur-sm border-b border-slate-200/80 dark:border-slate-800 text-slate-500 dark:text-slate-400 text-[11px] font-bold uppercase tracking-wider shadow-2xs">
                        <tr>
                            <th class="py-3 px-4 font-bold">Tanggal</th>
                            <th class="py-3 px-4 font-bold">Nama Siswa</th>
                            <th class="py-3 px-4 font-bold text-center">Status</th>
                            <th class="py-3 px-4 font-bold">Keterangan</th>
                        </tr>
                    </thead>
                    <tbody id="rekap-presensi-body" class="text-xs sm:text-sm divide-y divide-slate-100 dark:divide-slate-800/80 text-slate-700 dark:text-slate-300"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</template>

<template data-simni-modal>
    <!-- MODAL SCANNER QR -->
    <div id="modal-scanner" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-[10000] hidden flex-col items-center justify-center p-3 sm:p-4 no-print opacity-0 transition-opacity duration-200">
        <section class="simni-scanner-panel bg-white dark:bg-[#111113] rounded-3xl shadow-2xl border border-slate-200/80 dark:border-slate-800 w-full max-w-md overflow-hidden flex flex-col p-0" aria-labelledby="scanner-title" aria-describedby="scanner-instructions">
            <header class="simni-scanner-header px-5 py-4 border-b border-slate-100 dark:border-slate-800/80 flex items-center justify-between bg-slate-50/50 dark:bg-[#141416]/50">
                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-lg bg-indigo-500/10 text-indigo-600 flex items-center justify-center text-sm">
                        <i class="fas fa-qrcode"></i>
                    </div>
                    <div>
                        <h3 id="scanner-title" class="font-bold text-base text-slate-900 dark:text-white leading-tight">Scan Presensi</h3>
                        <p id="scan-date-label" class="text-xs text-slate-500 dark:text-slate-400">Hari ini</p>
                    </div>
                </div>
                <button type="button" data-simni-action="closeQRScanner" data-simni-trigger="click" class="simni-scanner-close w-8 h-8 rounded-full bg-slate-100 dark:bg-[#1c1c1f] hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-500 dark:text-slate-400 flex items-center justify-center transition-colors cursor-pointer text-xs" aria-label="Tutup pemindai QR">
                    <i class="fas fa-times"></i>
                </button>
            </header>
            <div class="simni-scanner-content p-5 space-y-3">
                <p id="scanner-instructions" class="text-xs text-slate-500 dark:text-slate-400 text-center leading-relaxed">Aktifkan kamera dan arahkan QR siswa ke dalam bingkai pemindai.</p>
                <div id="reader" class="overflow-hidden rounded-2xl border border-slate-200 dark:border-slate-800 bg-slate-950"></div>
                <p id="scan-result-text" class="simni-scanner-status text-xs font-semibold text-center text-emerald-600 dark:text-emerald-400 py-1" role="status" aria-live="polite" aria-atomic="true">Siap memindai QR siswa.</p>
                <p class="simni-scanner-help text-[11px] text-slate-400 text-center">Kamera tidak aktif? Pilih gambar QR dari galeri atau tutup scanner untuk absen manual.</p>
            </div>
        </section>
    </div>
</template>
