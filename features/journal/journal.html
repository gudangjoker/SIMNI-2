<!-- SIMNI PWA modular fragment: journal -->

<template data-simni-view>
<div id="view-jurnal" class="view-section hidden max-w-7xl mx-auto space-y-6 fade-in pb-16" hidden>
    <!-- Header Card -->
    <div class="bg-white dark:bg-[#111113] p-5 sm:p-6 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-2xs space-y-5">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-purple-500/10 dark:bg-purple-500/20 text-purple-600 dark:text-purple-400 flex items-center justify-center text-lg shrink-0">
                    <i class="fas fa-book-open" aria-hidden="true"></i>
                </div>
                <div>
                    <h2 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white tracking-tight">Jurnal Mengajar Harian</h2>
                    <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-0.5">Catatan aktivitas pembelajaran kelas, sinkronisasi jadwal otomatis, dan rekapitulasi.</p>
                </div>
            </div>

            <!-- Segmented Navigation Tabs -->
            <div class="simni-tab-group overflow-x-auto w-full md:w-auto hide-scrollbar">
                <button data-simni-action="setJurnalTab" data-simni-trigger="click" data-simni-args='["input"]' id="tab-jurnal-input" class="simni-tab active whitespace-nowrap">
                    <i class="fas fa-pen-nib mr-1"></i><span>Isi Jurnal</span>
                </button>
                <button data-simni-action="setJurnalTab" data-simni-trigger="click" data-simni-args='["rekap"]' id="tab-jurnal-rekap" class="simni-tab whitespace-nowrap">
                    <i class="fas fa-history mr-1"></i><span>Rekap Jurnal</span>
                </button>
                <button data-simni-action="setJurnalTab" data-simni-trigger="click" data-simni-args='["jadwal"]' id="tab-jurnal-jadwal" class="simni-tab whitespace-nowrap">
                    <i class="fas fa-calendar-alt mr-1"></i><span>Atur Jadwal</span>
                </button>
            </div>
        </div>
    </div>

    <!-- TAB 1: FORM INPUT JURNAL HARIAN -->
    <div id="jurnal-tab-input" class="space-y-4">
        <div class="bg-white dark:bg-[#111113] p-5 sm:p-6 rounded-2xl shadow-2xs border border-slate-200/80 dark:border-slate-800">
            <!-- Tanggal & Hari Banner -->
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-5 mb-5 border-b border-slate-100 dark:border-slate-800/80 gap-4">
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1.5" for="input-jurnal-tanggal">Tanggal Mengajar</label>
                    <input type="date" id="input-jurnal-tanggal" aria-label="Tanggal mengajar" data-simni-action="checkJurnalDateChange" data-simni-trigger="change" data-simni-argument="value" class="h-11 px-3.5 bg-slate-50/70 dark:bg-[#161618] border border-slate-200/80 dark:border-slate-700/80 rounded-xl text-xs sm:text-sm font-bold text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
                </div>
                <div class="flex items-center gap-2 bg-slate-50 dark:bg-[#161618] px-4 py-2 rounded-xl border border-slate-200/60 dark:border-slate-800">
                    <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Hari:</span>
                    <p id="jurnal-label-hari" class="text-sm font-black text-primary">Pilih Tanggal</p>
                </div>
            </div>

            <!-- Draft Status -->
            <div id="jurnal-draft-status-container" class="mb-4 empty:hidden">
                <div id="jurnal-form-container-draft-status" data-simni-draft-status class="hidden"></div>
            </div>

            <!-- Jurnal Entries Form Container -->
            <div id="jurnal-form-container" class="space-y-4"></div>

            <!-- Action Button Footer -->
            <div class="mt-6 pt-5 border-t border-slate-100 dark:border-slate-800/80 flex justify-end">
                <button data-simni-action="saveJurnalHarian" data-simni-trigger="click" class="simni-btn-primary h-11 px-6 text-sm font-bold shadow-2xs">
                    <i class="fas fa-save text-sm"></i>
                    <span>Simpan Jurnal Harian</span>
                </button>
            </div>
        </div>
    </div>

    <!-- TAB 2: REKAPITULASI JURNAL -->
    <div id="jurnal-tab-rekap" class="hidden space-y-4">
        <div class="bg-white dark:bg-[#111113] p-5 rounded-2xl shadow-2xs border border-slate-200/80 dark:border-slate-800 flex flex-col md:flex-row gap-4 items-end justify-between">
            <div class="flex-1 w-full max-w-xs">
                <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1.5" for="filter-jurnal-bulan">Pilih Periode Bulan</label>
                <input type="month" id="filter-jurnal-bulan" data-simni-action="renderRekapJurnal" data-simni-trigger="change" class="w-full h-11 px-3.5 bg-slate-50/70 dark:bg-[#161618] border border-slate-200/80 dark:border-slate-700/80 rounded-xl text-xs sm:text-sm font-bold text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
            </div>

            <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
                <button type="button" data-simni-action="previewPrintJurnal" data-simni-trigger="click" class="flex-1 md:flex-none h-11 px-4 bg-white dark:bg-[#18181b] hover:bg-slate-50 dark:hover:bg-[#202024] border border-slate-200/80 dark:border-slate-700/80 text-slate-700 dark:text-slate-300 rounded-xl text-xs sm:text-sm font-bold shadow-2xs transition-all flex items-center justify-center gap-2 cursor-pointer active:scale-95">
                    <i class="fas fa-print text-xs text-slate-400"></i>
                    <span>Pratinjau Cetak</span>
                </button>
                <button type="button" data-simni-action="exportJurnalExcel" data-simni-trigger="click" class="flex-1 md:flex-none h-11 px-4 bg-emerald-600/10 hover:bg-emerald-600/20 text-emerald-700 dark:text-emerald-400 border border-emerald-500/30 rounded-xl text-xs sm:text-sm font-bold shadow-2xs transition-all flex items-center justify-center gap-2 cursor-pointer active:scale-95">
                    <i class="fas fa-file-excel text-xs"></i>
                    <span>Ekspor Excel</span>
                </button>
                <button type="button" data-simni-action="cetakJurnalPDF" data-simni-trigger="click" class="flex-1 md:flex-none h-11 px-4 bg-slate-900 hover:bg-black dark:bg-[#1e1e24] dark:hover:bg-[#25252c] text-white rounded-xl text-xs sm:text-sm font-bold shadow-2xs transition-all flex items-center justify-center gap-2 border border-slate-700/60 dark:border-slate-700 cursor-pointer active:scale-95">
                    <i class="fas fa-file-pdf text-rose-400 text-xs"></i>
                    <span>Unduh PDF</span>
                </button>
            </div>
        </div>

        <div id="rekap-jurnal-body" class="space-y-3"></div>
    </div>

    <!-- TAB 3: MASTER JADWAL MENGAJAR -->
    <div id="jurnal-tab-jadwal" class="hidden space-y-4">
        <div class="bg-indigo-50/80 dark:bg-indigo-950/30 border border-indigo-200/70 dark:border-indigo-800/50 p-4 rounded-2xl flex items-start gap-3">
            <div class="w-8 h-8 rounded-lg bg-indigo-500/10 text-primary flex items-center justify-center text-sm shrink-0 mt-0.5">
                <i class="fas fa-info-circle"></i>
            </div>
            <div>
                <p class="text-xs sm:text-sm font-bold text-indigo-900 dark:text-indigo-300">Konfigurasi Jadwal Otomatis</p>
                <p class="text-[11px] sm:text-xs text-indigo-700 dark:text-indigo-400 mt-0.5 leading-relaxed">Isi matriks jadwal di bawah ini satu kali. Setiap mata pelajaran akan terisi secara otomatis saat Anda membuka formulir Jurnal Harian berdasarkan hari yang dipilih.</p>
            </div>
        </div>

        <div class="bg-white dark:bg-[#111113] rounded-2xl shadow-2xs border border-slate-200/80 dark:border-slate-800 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-center border-collapse min-w-[650px]">
                    <thead>
                        <tr class="bg-slate-900 dark:bg-[#161618] text-white text-[11px] font-bold uppercase tracking-wider">
                            <th class="py-3.5 px-3 border border-slate-800 dark:border-slate-700/80 w-20">Jam Ke-</th>
                            <th class="py-3.5 px-3 border border-slate-800 dark:border-slate-700/80 w-32">Senin</th>
                            <th class="py-3.5 px-3 border border-slate-800 dark:border-slate-700/80 w-32">Selasa</th>
                            <th class="py-3.5 px-3 border border-slate-800 dark:border-slate-700/80 w-32">Rabu</th>
                            <th class="py-3.5 px-3 border border-slate-800 dark:border-slate-700/80 w-32">Kamis</th>
                            <th class="py-3.5 px-3 border border-slate-800 dark:border-slate-700/80 w-32">Jumat</th>
                        </tr>
                    </thead>
                    <tbody id="jadwal-table-body" class="text-xs"></tbody>
                </table>
            </div>
            <div class="p-4 sm:px-5 bg-slate-50/50 dark:bg-[#141416]/50 border-t border-slate-100 dark:border-slate-800/80 flex justify-end">
                <button data-simni-action="saveJadwalMaster" data-simni-trigger="click" class="h-10 px-5 bg-primary hover:bg-indigo-600 text-white rounded-xl text-xs sm:text-sm font-bold shadow-2xs hover:shadow-sm transition-all flex items-center gap-2 cursor-pointer active:scale-95">
                    <i class="fas fa-save text-xs"></i>
                    <span>Simpan Jadwal Master</span>
                </button>
            </div>
        </div>
    </div>
</div>
</template>

<template data-simni-modal>
    <!-- MODAL PRATINJAU CETAK JURNAL -->
    <div id="modal-preview-cetak-jurnal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-[10020] hidden flex-col items-center justify-center p-2 sm:p-4 no-print opacity-0 transition-opacity duration-200">
        <div class="bg-white dark:bg-[#111113] rounded-3xl shadow-2xl w-full max-w-4xl max-h-[95vh] flex flex-col overflow-hidden border border-slate-200/80 dark:border-slate-800">
            <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-800/80 flex justify-between items-center bg-slate-50/50 dark:bg-[#141416]/50">
                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-lg bg-primary/10 text-primary flex items-center justify-center text-sm">
                        <i class="fas fa-print"></i>
                    </div>
                    <h3 class="font-bold text-base text-slate-900 dark:text-white">Pratinjau Cetak Jurnal Mengajar</h3>
                </div>
                <div class="flex items-center gap-2">
                    <button type="button" data-simni-action="executePrintJurnalPreview" data-simni-trigger="click" class="h-9 px-4 bg-primary hover:bg-indigo-600 text-white text-xs font-bold rounded-xl shadow-2xs flex items-center gap-1.5 cursor-pointer transition-colors active:scale-95">
                        <i class="fas fa-file-pdf text-xs"></i><span>Cetak / Simpan PDF</span>
                    </button>
                    <button type="button" aria-label="Tutup pratinjau jurnal" data-simni-action="closeModal" data-simni-trigger="click" data-simni-args='["modal-preview-cetak-jurnal"]' class="w-8 h-8 rounded-full bg-slate-100 dark:bg-[#1c1c1f] hover:bg-slate-200 dark:hover:bg-slate-700 flex items-center justify-center text-slate-500 dark:text-slate-400 cursor-pointer text-xs">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
            <div class="p-4 sm:p-6 overflow-y-auto flex-1 bg-slate-100 dark:bg-[#0b0f19]">
                <div id="area-preview-cetak-jurnal" class="bg-white text-slate-900 p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-200 max-w-[210mm] mx-auto min-h-[297mm]">
                    <!-- Konten dinamis di-render oleh previewPrintJurnal() -->
                </div>
            </div>
        </div>
    </div>
</template>
