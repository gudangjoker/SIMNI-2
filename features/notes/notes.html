<!-- SIMNI PWA modular fragment: notes -->

<template data-simni-view>
<div id="view-catatan" class="view-section hidden max-w-7xl mx-auto space-y-6 fade-in pb-16" hidden>
    <!-- Header Card -->
    <div class="bg-white dark:bg-[#111113] p-5 sm:p-6 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-2xs space-y-5">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-amber-500/10 dark:bg-amber-500/20 text-amber-600 dark:text-amber-400 flex items-center justify-center text-lg shrink-0">
                    <i class="fas fa-clipboard-list" aria-hidden="true"></i>
                </div>
                <div>
                    <h2 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white tracking-tight">Catatan Guru &amp; Anekdotal</h2>
                    <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-0.5">Rekam jejak observasi perilaku, perkembangan karakter, dan peristiwa di kelas.</p>
                </div>
            </div>

            <!-- Segmented Navigation Tabs -->
            <div class="flex items-center p-1 bg-slate-100 dark:bg-[#18181b] rounded-xl border border-slate-200/80 dark:border-slate-800 w-full sm:w-auto">
                <button data-simni-action="setCatatanTab" data-simni-trigger="click" data-simni-args='["input"]' id="tab-catatan-input" class="flex-1 sm:flex-none whitespace-nowrap px-4 py-2 border-b-2 border-primary text-primary font-bold text-xs sm:text-sm transition-all cursor-pointer">
                    <i class="fas fa-edit mr-1.5"></i>Tulis Catatan
                </button>
                <button data-simni-action="setCatatanTab" data-simni-trigger="click" data-simni-args='["rekap"]' id="tab-catatan-rekap" class="flex-1 sm:flex-none whitespace-nowrap px-4 py-2 border-b-2 border-transparent text-slate-500 dark:text-slate-400 font-bold text-xs sm:text-sm hover:text-slate-800 dark:hover:text-slate-200 transition-all cursor-pointer">
                    <i class="fas fa-archive mr-1.5"></i>Rekap Catatan
                </button>
            </div>
        </div>
    </div>

    <!-- TAB 1: FORM INPUT CATATAN -->
    <div id="catatan-tab-input" class="space-y-4">
        <form data-simni-action="submitCatatan" data-simni-trigger="submit" data-simni-argument="event" class="bg-white dark:bg-[#111113] p-5 sm:p-6 rounded-2xl shadow-2xs border border-slate-200/80 dark:border-slate-800 max-w-2xl mx-auto space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1.5" for="input-catatan-tanggal">Tanggal Kejadian</label>
                    <input type="date" id="input-catatan-tanggal" aria-label="Tanggal catatan" required class="w-full h-11 px-3.5 bg-slate-50/70 dark:bg-[#161618] border border-slate-200/80 dark:border-slate-700/80 rounded-xl text-xs sm:text-sm font-bold text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1.5" for="input-catatan-siswa">Pilih Siswa</label>
                    <select id="input-catatan-siswa" aria-label="Siswa catatan" required class="w-full h-11 px-3.5 bg-slate-50/70 dark:bg-[#161618] border border-slate-200/80 dark:border-slate-700/80 rounded-xl text-xs sm:text-sm font-bold text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
                        <option value="">-- Pilih Siswa --</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1.5" for="input-catatan-teks">Uraian Kejadian / Catatan Anekdot</label>
                <textarea id="input-catatan-teks" required rows="5" placeholder="Ketik deskripsi perilaku atau pengamatan murid secara lengkap..." class="w-full p-3.5 bg-slate-50/70 dark:bg-[#161618] border border-slate-200/80 dark:border-slate-700/80 rounded-xl text-xs sm:text-sm font-medium text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all whitespace-pre-wrap"></textarea>
            </div>
            <div class="pt-2 flex justify-end">
                <button type="submit" class="h-10 px-5 bg-primary hover:bg-indigo-600 text-white rounded-xl text-xs sm:text-sm font-bold shadow-2xs hover:shadow-sm transition-all flex items-center justify-center gap-2 cursor-pointer active:scale-95 w-full sm:w-auto">
                    <i class="fas fa-save text-xs"></i>
                    <span>Simpan Catatan</span>
                </button>
            </div>
        </form>
    </div>

    <!-- TAB 2: REKAP CATATAN -->
    <div id="catatan-tab-rekap" class="hidden space-y-4">
        <div class="bg-white dark:bg-[#111113] p-5 rounded-2xl shadow-2xs border border-slate-200/80 dark:border-slate-800 flex flex-col md:flex-row gap-4 items-end justify-between">
            <div class="flex-1 w-full max-w-sm">
                <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1.5" for="filter-catatan-siswa">Filter Nama Siswa</label>
                <select id="filter-catatan-siswa" aria-label="Filter siswa catatan" data-simni-action="renderCatatanList" data-simni-trigger="change" class="w-full h-11 px-3.5 bg-slate-50/70 dark:bg-[#161618] border border-slate-200/80 dark:border-slate-700/80 rounded-xl text-xs sm:text-sm font-bold text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
                    <option value="">Semua Siswa</option>
                </select>
            </div>
            <div class="w-full md:w-auto">
                <button data-simni-action="cetakCatatanPDF" data-simni-trigger="click" class="w-full md:w-auto h-11 px-5 bg-slate-900 hover:bg-black dark:bg-[#1e1e24] dark:hover:bg-[#25252c] text-white rounded-xl text-xs sm:text-sm font-bold shadow-2xs transition-all flex items-center justify-center gap-2 border border-slate-700/60 dark:border-slate-700 cursor-pointer active:scale-95">
                    <i class="fas fa-file-pdf text-rose-400 text-xs"></i>
                    <span>Unduh Rekap PDF</span>
                </button>
            </div>
        </div>

        <div id="catatan-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>
</div>
</template>
